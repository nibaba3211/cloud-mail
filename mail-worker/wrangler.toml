name = "cloud-mail"
main = "src/index.js"
compatibility_date = "2025-06-04"
keep_vars = true

[observability]
enabled = true

[[d1_databases]]
binding = "db" #d1数据库绑定名默认不可修改
database_name = "cloud-mail" #d1数据库名字
database_id = "ba290dd4-cd03-4759-901b-1f14dedb5e9a" #d1数据库id

[[kv_namespaces]]
binding = "kv" #kv绑定名默认不可修改
id = "3f36b0fd309a4217b21bfb781abff1ce" #kv数据库id

#[[r2_buckets]]
#binding = "r2" #r2对象存储绑定名默认不可修改
#bucket_name = "" #r2对象存储桶的名字

#[[send_email]]
#name = "email" #CF发件, 配置后优先使用

[ai]
binding = "ai"

[assets]
binding = "assets" #静态资源绑定名默认不可修改
directory = "./dist" #前端vue项目打包的静态资源存放位置,默认dist
not_found_handling = "single-page-application"
run_worker_first = true

[triggers]
crons = ["0 * * * *"] #每小时执行；resetDaySendCount 仅在 UTC 0 点生效

[vars]
#ai_model = "" #ai模型,不填默认使用@cf/meta/llama-3.1-8b-instruct-fast
#analysis_cache = false #是否开启分析数据缓存
#orm_log = false #是否sql日志
#domain = [] #邮件域名可可配置多个 示例: ["example1.com","example2.com"]
#admin = "" #管理员的邮箱 示例: admin@example.com
#jwt_secret = "" #jwt令牌的密钥,随便填一串字符串

[build]
command = "pnpm --prefix ../mail-vue install && pnpm --prefix ../mail-vue run build"
# ===== 第二个邮箱 gkstar.jp（Worker: cloud-mail2）部署命令: npx wrangler deploy --env mail2 =====
[env.mail2]
name = "cloud-mail2"
keep_vars = true

[[env.mail2.d1_databases]]
binding = "db"
database_name = "mail2"
database_id = "24d49238-f85b-4fdf-b7f1-970e5d51fd1d"

[[env.mail2.kv_namespaces]]
binding = "kv"
id = "9add8b90cb72408abee80ab55a4aaf83"

[env.mail2.ai]
binding = "ai"

[env.mail2.assets]
binding = "assets"
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = true
